name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: macOS source, tests and native preview
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - name: Install native dependencies
        run: brew install cmake pkgconf ffmpeg sdl2 libxml2 python@3.13
      - name: Select Python
        run: echo "$(brew --prefix python@3.13)/libexec/bin" >> "$GITHUB_PATH"
      - name: Record and verify FFmpeg 9 toolchain
        run: |
          ffmpeg -version
          pkg-config --modversion libavcodec libavformat
          test "$(pkg-config --modversion libavcodec | cut -d. -f1)" = 63
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Build and stage native SDK
        run: |
          python3 scripts/build-mlt.py
          python3 scripts/bundle-mlt.py
      - name: Check source, formatting, builds and tests
        run: sh scripts/check.sh
      - name: Verify native media composition
        run: python3 scripts/test-mlt.py
