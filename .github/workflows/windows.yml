name: Windows installer
on:
  push:
    branches: [main, codex/windows-support]
  pull_request:
  workflow_dispatch:
env:
  PYTHONUTF8: "1"
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Set up pinned native dependencies
        run: ./scripts/setup-windows.ps1
      - name: Check Rust and source
        run: |
          python scripts/check_source_release.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check_source_size.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/bundle-windows.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo fmt --manifest-path desktop/Cargo.toml -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --manifest-path desktop/Cargo.toml --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --manifest-path desktop/Cargo.toml --locked --bin mstudio-desktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and validate installer
        run: ./scripts/bundle-windows.ps1 -SkipSetup
      - name: Upload validated installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Mstudio-Windows-x64
          path: desktop/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
