[package]
name = "mstudio-desktop"
version = "0.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/Yaozy-C/mstudio"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
gstreamer = { version = "0.25" }
gstreamer-app = { version = "0.25" }
gstreamer-video = { version = "0.25" }
gstreamer-editing-services = { version = "0.25", features = ["v1_24"] }
mstudio = { path = ".." }
tauri = { version = "2.11", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["time", "macros", "process", "io-util", "sync"] }

rig-core = { version = "=0.42.0", default-features = false, features = ["reqwest", "rustls"] }
rig-agent = { version = "=0.42.0", default-features = false }
tokio-util = "0.7"
base64 = "0.22"
sha2 = "0.10"
flate2 = "1"
futures = "0.3"
rquickjs = "=0.14.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
tracing-appender = "0.2"

rig-http = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }

[[example]]
name = "ges_play"
